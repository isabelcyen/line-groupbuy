<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>揪團後台管理</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<style>
:root {
  --green: #06C755;
  --green-dk: #05a849;
  --bg: #f4f4f4;
  --card: #ffffff;
  --text: #111111;
  --muted: #888888;
  --border: #e0e0e0;
  --danger: #e53935;
  --warning: #f57c00;
  --info: #1976d2;
  --row-hover: rgba(0,0,0,0.03);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1a1a; --card: #252525; --text: #f0f0f0;
    --muted: #aaaaaa; --border: #3a3a3a; --row-hover: rgba(255,255,255,0.04);
  }
}
:root[data-theme="dark"] {
  --bg: #1a1a1a; --card: #252525; --text: #f0f0f0;
  --muted: #aaaaaa; --border: #3a3a3a; --row-hover: rgba(255,255,255,0.04);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

body {
  font-family: 'Noto Sans TC', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
}

/* ── Login ── */
#loginScreen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 16px;
}
.login-card {
  background: var(--card); border-radius: 20px;
  padding: 40px 32px; width: 100%; max-width: 360px;
  box-shadow: 0 8px 32px rgba(0,0,0,.12);
}
.login-logo { font-size: 2.5rem; text-align: center; margin-bottom: 16px; }
.login-card h1 { font-size: 1.4rem; text-align: center; margin-bottom: 4px; }
.login-card p  { color: var(--muted); text-align: center; margin-bottom: 28px; font-size: .88rem; }

/* ── App shell ── */
#adminScreen { display: flex; flex-direction: column; min-height: 100vh; }

.top-bar {
  background: var(--green); color: #fff;
  padding: 0 16px; height: 52px;
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0; position: sticky; top: 0; z-index: 100;
}
.top-bar-title { font-weight: 700; font-size: 1rem; flex: 1; }
.top-bar-btn {
  background: rgba(255,255,255,.22); border: none; color: #fff;
  padding: 5px 12px; border-radius: 8px; cursor: pointer;
  font-size: .82rem; font-family: inherit;
}

/* ── Tabs ── */
.tab-bar {
  background: var(--card); border-bottom: 1px solid var(--border);
  display: flex; overflow-x: auto; flex-shrink: 0;
  scrollbar-width: none; position: sticky; top: 52px; z-index: 99;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 11px 18px; border: none; background: none;
  color: var(--muted); cursor: pointer; font-size: .85rem;
  white-space: nowrap; border-bottom: 2.5px solid transparent;
  font-family: inherit; transition: color .15s;
}
.tab-btn.active { color: var(--green); border-bottom-color: var(--green); font-weight: 600; }

.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ── Forms ── */
.form-wrap { max-width: 600px; margin: 0 auto; padding: 20px 16px; }
.form-group { margin-bottom: 18px; }
label.field-label {
  display: block; font-size: .8rem; font-weight: 600;
  color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em;
}
label.field-label .req { color: var(--danger); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

input[type=text],
input[type=number],
input[type=password],
input[type=date],
input[type=time],
textarea {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--border); border-radius: 10px;
  font-size: .95rem; font-family: inherit;
  background: var(--card); color: var(--text);
  outline: none; transition: border-color .18s;
  -webkit-appearance: none;
}
input:focus, textarea:focus { border-color: var(--green); }
textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
.hint { font-size: .75rem; color: var(--muted); margin-top: 5px; }

/* ── 日期+時間並排 ── */
.datetime-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
.datetime-row input[type=date] { flex: 1; min-width: 0; }
.datetime-row input[type=time] { width: 118px; flex-shrink: 0; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  padding: 8px 14px; border: none; border-radius: 8px;
  cursor: pointer; font-family: inherit; font-size: .82rem; font-weight: 600;
  transition: opacity .15s, transform .1s; white-space: nowrap;
}
.btn:hover { opacity: .85; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--green); color: #fff; }
.btn-block { width: 100%; padding: 13px; font-size: .97rem; }
.btn-danger  { background: var(--danger);  color: #fff; }
.btn-warning { background: var(--warning); color: #fff; }
.btn-info    { background: var(--info);    color: #fff; }
.btn-ghost   { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.btn-sm { padding: 4px 9px; font-size: .75rem; border-radius: 6px; }

/* ── Section header ── */
.section-header {
  padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; min-height: 44px;
}
.section-header h2 { font-size: .95rem; flex: 1; }

/* ── Table ── */
.table-outer { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .82rem; min-width: 480px; }
th {
  background: var(--bg); padding: 9px 12px;
  text-align: left; font-weight: 600; color: var(--muted);
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:hover td { background: var(--row-hover); }
.td-actions { display: flex; gap: 5px; flex-wrap: wrap; }

/* ── Status badges ── */
.badge {
  display: inline-block; padding: 2px 9px;
  border-radius: 12px; font-size: .72rem; font-weight: 600;
}
.badge-pending   { background: #fff3e0; color: #e65100; }
.badge-reviewing { background: #e3f2fd; color: #1565c0; }
.badge-confirmed { background: #e8f5e9; color: #2e7d32; }
.badge-shipped   { background: #f3e5f5; color: #6a1b9a; }
.badge-cancelled { background: #fce4ec; color: #c62828; }
.badge-active    { background: #e8f5e9; color: #2e7d32; }
.badge-closed    { background: #eeeeee; color: #616161; }

/* ── Empty / loading state ── */
.state-box { text-align: center; padding: 52px 16px; color: var(--muted); }
.state-box .state-icon { font-size: 2.4rem; margin-bottom: 12px; }
.state-box p { font-size: .88rem; }

/* ── File upload button ── */
.file-upload-btn {
  display: inline-block; cursor: pointer;
  padding: 8px 16px; border-radius: 8px;
  border: 1.5px dashed var(--border);
  background: var(--bg); color: var(--muted);
  font-size: .88rem; font-weight: 500;
  transition: border-color .2s, color .2s;
}
.file-upload-btn:hover { border-color: var(--green); color: var(--green); }

/* ── 圖片 grid 預覽 ── */
.img-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
  gap: 8px;
  margin-bottom: 8px;
}
.img-thumb {
  aspect-ratio: 1;
  border-radius: 8px;
  border: 1px solid var(--border);
  overflow: hidden;
  position: relative;
}
.img-thumb img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
}

/* ── Toast ── */
#toast {
  position: fixed; bottom: max(24px, env(safe-area-inset-bottom, 24px)); left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: #222; color: #fff; padding: 10px 22px;
  border-radius: 24px; font-size: .88rem; font-weight: 500;
  opacity: 0; transition: opacity .25s, transform .25s; z-index: 9999;
  pointer-events: none; white-space: nowrap; max-width: calc(100vw - 32px);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  z-index: 1000; display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.modal-box {
  background: var(--card); border-radius: 18px;
  width: 100%; max-width: 520px; max-height: 88vh;
  overflow-y: auto; padding: 24px;
}
.modal-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 20px; }
.modal-actions { display: flex; gap: 8px; margin-top: 20px; }

/* ── Clickable row ── */
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: rgba(6,199,85,.06); }

/* ── Back section ── */
.back-row { display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>

<!-- ─────────────── LOGIN ─────────────── -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">🛒</div>
    <h1>揪團後台管理</h1>
    <p>請輸入管理員密碼</p>
    <div class="form-group">
      <input type="password" id="pwdInput" placeholder="管理員密碼"
             onkeydown="if(event.key==='Enter')login()">
    </div>
    <button class="btn btn-primary btn-block" onclick="login()">登入</button>
  </div>
</div>

<!-- ─────────────── ADMIN ─────────────── -->
<div id="adminScreen" hidden>

  <div class="top-bar">
    <span class="top-bar-title">🛒 揪團後台</span>
    <button class="top-bar-btn" onclick="logout()">登出</button>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tbtn-create"  onclick="switchTab('create')">＋ 開新團</button>
    <button class="tab-btn"        id="tbtn-manage"  onclick="switchTab('manage')">📋 開團管理</button>
    <button class="tab-btn"        id="tbtn-orders"  onclick="switchTab('orders')">📦 訂單管理</button>
  </div>

  <!-- ══ Tab: 開新團 ══ -->
  <div id="pane-create" class="tab-pane active">
    <div class="form-wrap">

      <div class="form-group">
        <label class="field-label">商品名稱 <span class="req">*</span></label>
        <input type="text" id="c-name" placeholder="例：高雄愛文芒果 10斤">
      </div>

      <div class="form-group">
        <label class="field-label">商品說明</label>
        <textarea id="c-desc" placeholder="產地、特色、注意事項…" oninput="syncCreateDescPreview()"></textarea>
      </div>

      <!-- ✅ 多圖上傳（最多 10 張） -->
      <div class="form-group">
        <label class="field-label">商品圖片（最多 10 張）</label>
        <label class="file-upload-btn" for="c-image-file">📷 選擇圖片</label>
        <input type="file" id="c-image-file" accept="image/*" multiple style="display:none"
               onchange="handleCreateImageSelect(this)">
        <input type="hidden" id="c-image-url">
        <div id="c-img-preview-wrap" style="margin-top:10px;display:none">
          <div class="img-grid" id="c-img-grid"></div>
          <div id="c-img-filename" style="font-size:.8rem;color:var(--muted)"></div>
          <div id="c-desc-preview" style="margin-top:8px;font-size:.85rem;color:var(--muted);white-space:pre-wrap"></div>
        </div>
      </div>

      <!-- ✅ 截止日期 + 截止時間 並排 -->
      <div class="form-group">
        <label class="field-label">截止日期與時間 <span class="req">*</span></label>
        <div class="datetime-row">
          <input type="date" id="c-deadline">
          <input type="time" id="c-deadlineTime" value="23:59">
        </div>
        <p class="hint">截止後系統自動鎖定，團員無法繼續下單</p>
      </div>

      <!-- ✅ 規格（價格） -->
      <div class="form-group">
        <label class="field-label">規格（價格）</label>
        <input type="text" id="c-variants" placeholder="酪梨(150),百香果(100),抹茶(120)">
        <p class="hint">格式：名稱(價格)，逗號分隔。若所有規格同價，可直接填名稱如：原味,巧克力</p>
      </div>

      <div class="form-group">
        <label class="field-label">包裝方式</label>
        <input type="text" id="c-packaging" value="標準包裝">
        <p class="hint">逗號分隔，可填多種包裝方式</p>
      </div>

      <button class="btn btn-primary btn-block" id="createBtn" onclick="createProduct()">
        🚀 開始揪團！
      </button>
    </div>
  </div>

  <!-- ══ Tab: 開團管理 ══ -->
  <div id="pane-manage" class="tab-pane">
    <div class="section-header">
      <h2>開團管理</h2>
      <button class="btn btn-ghost btn-sm" onclick="loadProducts()">↻ 重新整理</button>
    </div>
    <div id="manage-body">
      <div class="state-box"><div class="state-icon">📋</div><p>點上方分頁載入資料</p></div>
    </div>
  </div>

  <!-- ══ Tab: 訂單管理 ══ -->
  <div id="pane-orders" class="tab-pane">
    <!-- Level 1: 商品列表 -->
    <div id="ord-lv1">
      <div class="section-header">
        <h2>選擇商品</h2>
        <button class="btn btn-ghost btn-sm" onclick="loadOrdersTab()">↻ 重新整理</button>
      </div>
      <div id="ord-products"></div>
    </div>
    <!-- Level 2: 該商品的訂單 -->
    <div id="ord-lv2" hidden>
      <div class="section-header back-row">
        <button class="btn btn-ghost btn-sm" onclick="ordBack()">← 返回</button>
        <h2 id="ord-product-name">訂單列表</h2>
      </div>
      <div id="ord-list"></div>
    </div>
  </div>

</div><!-- /adminScreen -->

<!-- ── Edit / Copy modal ── -->
<div id="editModal" class="modal-overlay" hidden>
  <div class="modal-box">
    <div class="modal-title" id="editModalTitle">編輯商品</div>
    <input type="hidden" id="e-productId">
    <input type="hidden" id="e-isNew">

    <div class="form-group">
      <label class="field-label">商品名稱 <span class="req">*</span></label>
      <input type="text" id="e-name">
    </div>

    <div class="form-group">
      <label class="field-label">商品說明文字</label>
      <textarea id="e-desc" placeholder="輸入商品說明、注意事項…"></textarea>
    </div>

    <!-- ✅ 多圖上傳（最多 10 張） -->
    <div class="form-group">
      <label class="field-label">商品圖片（最多 10 張）</label>
      <div id="img-preview-wrap" style="margin-top:6px;display:none">
        <div class="img-grid" id="e-img-grid"></div>
        <div id="desc-preview" style="margin-top:8px;font-size:.85rem;color:var(--muted);white-space:pre-wrap"></div>
      </div>
      <label class="file-upload-btn" for="e-image-file" style="margin-top:8px">📷 選擇圖片</label>
      <input type="file" id="e-image-file" accept="image/*" multiple style="display:none"
             onchange="handleEditImageSelect(this)">
      <input type="hidden" id="e-image-url">
      <div id="e-img-filename" style="margin-top:6px;font-size:.8rem;color:var(--muted)"></div>
    </div>

    <!-- ✅ 截止日期 + 截止時間 並排 -->
    <div class="form-group">
      <label class="field-label">截止日期與時間 <span class="req">*</span></label>
      <div class="datetime-row">
        <input type="date" id="e-deadline">
        <input type="time" id="e-deadlineTime" value="23:59">
      </div>
      <p class="hint">截止後系統自動鎖定，團員無法繼續下單</p>
    </div>

    <!-- ✅ 規格（價格） -->
    <div class="form-group">
      <label class="field-label">規格（價格）</label>
      <input type="text" id="e-variants" placeholder="酪梨(150),百香果(100),抹茶(120)">
      <p class="hint">格式：名稱(價格)，逗號分隔。若所有規格同價，可直接填名稱如：原味,巧克力</p>
    </div>

    <div class="form-group">
      <label class="field-label">包裝方式</label>
      <input type="text" id="e-packaging">
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" style="flex:2" id="editSaveBtn" onclick="saveEdit()">儲存</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
'use strict';
const API = 'https://line-group-buy.isabelcyen.workers.dev';
let secret = '';
let allProducts = [];
let allOrders   = [];

/* ══════════════════════════════════
   AUTH
══════════════════════════════════ */
function login() {
  const v = document.getElementById('pwdInput').value;
  if (!v) { toast('請輸入密碼'); return; }
  secret = v;
  document.getElementById('loginScreen').hidden = true;
  document.getElementById('adminScreen').hidden = false;
}
function logout() {
  secret = '';
  document.getElementById('loginScreen').hidden = false;
  document.getElementById('adminScreen').hidden = true;
  document.getElementById('pwdInput').value = '';
}

/* ══════════════════════════════════
   TABS
══════════════════════════════════ */
function switchTab(tab) {
  ['create','manage','orders'].forEach(t => {
    document.getElementById('tbtn-' + t).classList.toggle('active', t === tab);
    document.getElementById('pane-' + t).classList.toggle('active', t === tab);
  });
  if (tab === 'manage') loadProducts();
  if (tab === 'orders') loadOrdersTab();
}

/* ══════════════════════════════════
   API
══════════════════════════════════ */
async function api(body) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...body, adminSecret: secret })
  });
  return r.json();
}

/* ══════════════════════════════════
   ✅ 日期時間工具
══════════════════════════════════ */
function splitDeadline(isoStr) {
  if (!isoStr) return { date: '', time: '23:59' };
  try {
    const d = new Date(isoStr);
    const date = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(d);
    const time = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false
    }).format(d);
    return { date, time };
  } catch {
    return { date: isoStr.slice(0, 10), time: '23:59' };
  }
}

function buildDeadlineISO(dateStr, timeStr) {
  if (!dateStr) return '';
  const t = timeStr || '23:59';
  return new Date(`${dateStr}T${t}:00+08:00`).toISOString();
}

function fmtDeadline(isoStr) {
  if (!isoStr) return '-';
  try {
    if (isoStr.length === 10) return isoStr + ' 23:59';
    return new Intl.DateTimeFormat('zh-TW', {
      timeZone: 'Asia/Taipei',
      month: 'numeric', day: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: false
    }).format(new Date(isoStr));
  } catch {
    return isoStr;
  }
}

/* ══════════════════════════════════
   ✅ 圖片上傳（單張）
══════════════════════════════════ */
async function uploadImageToGAS(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = async e => {
      const base64 = e.target.result.split(',')[1];
      try {
        const d = await api({
          action: 'upload_image', imageData: base64,
          mimeType: file.type, fileName: file.name
        });
        if (d.ok) resolve(d.data?.imageUrl || d.imageUrl || '');
        else { toast('❌ 圖片上傳失敗：' + (d.error || '未知錯誤')); resolve(null); }
      } catch { toast('❌ 圖片上傳失敗，請稍後再試'); resolve(null); }
    };
    reader.readAsDataURL(file);
  });
}

/* ✅ 建立圖片預覽 grid */
function buildImgGrid(files, gridId) {
  const grid = document.getElementById(gridId);
  if (!grid) return;
  grid.innerHTML = '';
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const div = document.createElement('div');
      div.className = 'img-thumb';
      div.innerHTML = `<img src="${e.target.result}" alt="">`;
      grid.appendChild(div);
    };
    reader.readAsDataURL(file);
  });
}

/* ✅ 建立現有圖片 grid（從逗號分隔 URL） */
function buildExistingImgGrid(urlStr, gridId) {
  const grid = document.getElementById(gridId);
  if (!grid) return;
  grid.innerHTML = '';
  const urls = urlStr.split(',').map(u => u.trim()).filter(Boolean);
  urls.forEach(url => {
    const div = document.createElement('div');
    div.className = 'img-thumb';
    div.innerHTML = `<img src="${url}" alt="" onerror="this.parentElement.style.display='none'">`;
    grid.appendChild(div);
  });
}

/* ── 建立表單圖片選擇處理 ── */
function handleCreateImageSelect(input) {
  const files = Array.from(input.files || []);
  const wrap = document.getElementById('c-img-preview-wrap');
  if (!files.length) {
    wrap.style.display = 'none';
    document.getElementById('c-image-url').value = '';
    return;
  }
  if (files.length > 10) {
    toast('❌ 最多只能上傳 10 張圖片');
    input.value = '';
    return;
  }
  buildImgGrid(files, 'c-img-grid');
  document.getElementById('c-img-filename').textContent =
    `已選擇 ${files.length} 張圖片（送出時自動上傳）`;
  document.getElementById('c-desc-preview').textContent =
    document.getElementById('c-desc').value.trim();
  wrap.style.display = 'block';
  document.getElementById('c-image-url').value = '';
}

function syncCreateDescPreview() {
  document.getElementById('c-desc-preview').textContent =
    document.getElementById('c-desc').value.trim();
}

/* ── 編輯 modal 圖片選擇處理 ── */
function handleEditImageSelect(input) {
  const files = Array.from(input.files || []);
  if (!files.length) return;
  if (files.length > 10) {
    toast('❌ 最多只能上傳 10 張圖片');
    input.value = '';
    return;
  }
  buildImgGrid(files, 'e-img-grid');
  document.getElementById('img-preview-wrap').style.display = 'block';
  document.getElementById('e-img-filename').textContent =
    `已選擇 ${files.length} 張（送出後取代現有圖片）`;
  document.getElementById('desc-preview').textContent =
    document.getElementById('e-desc').value.trim();
}

/* ══════════════════════════════════
   開新團
══════════════════════════════════ */
function clearCreate() {
  ['c-name','c-desc','c-price','c-variants'].forEach(id =>
    document.getElementById(id).value = '');
  document.getElementById('c-image-url').value  = '';
  document.getElementById('c-image-file').value = '';
  document.getElementById('c-img-preview-wrap').style.display = 'none';
  document.getElementById('c-img-grid').innerHTML = '';
  document.getElementById('c-img-filename').textContent = '';
  document.getElementById('c-unit').value         = '份';
  document.getElementById('c-minqty').value       = '1';
  document.getElementById('c-maxqty').value       = '99';
  document.getElementById('c-deadline').value     = '';
  document.getElementById('c-deadlineTime').value = '23:59';
  document.getElementById('c-packaging').value    = '標準包裝';
}

async function createProduct() {
  const name     = document.getElementById('c-name').value.trim();
  const deadline = document.getElementById('c-deadline').value;
  if (!name)     { toast('請填寫商品名稱'); return; }
  if (!deadline) { toast('請選擇截止日期'); return; }

  const deadlineTime = document.getElementById('c-deadlineTime').value || '23:59';
  const deadlineISO  = buildDeadlineISO(deadline, deadlineTime);

  const btn = document.getElementById('createBtn');
  btn.disabled = true; btn.textContent = '建立中…';

  try {
    let imageUrl = document.getElementById('c-image-url').value.trim();
    const fileInput = document.getElementById('c-image-file');
    const files = Array.from(fileInput.files || []);

    if (files.length > 0) {
      const urls = [];
      for (let i = 0; i < files.length; i++) {
        btn.textContent = `上傳第 ${i + 1}/${files.length} 張圖片…`;
        const uploadedUrl = await uploadImageToGAS(files[i]);
        if (uploadedUrl === null) {
          btn.disabled = false; btn.textContent = '🚀 開始揪團！';
          return;
        }
        urls.push(uploadedUrl);
      }
      imageUrl = urls.join(',');
      document.getElementById('c-image-url').value = imageUrl;
      document.getElementById('c-img-filename').textContent = `✅ ${urls.length} 張圖片已上傳`;
      btn.textContent = '建立中…';
    }

    const d = await api({
      action:      'create_product',
      name,
      description: document.getElementById('c-desc').value.trim(),
      imageUrl,
      price:       0,
      unit:        '份',
      minQty:      1,
      maxQty:      99,
      deadline:    deadlineISO,
      variants:    document.getElementById('c-variants').value,
      packaging:   document.getElementById('c-packaging').value || '標準包裝'
    });
    if (d.ok) { toast('✅ 開團成功！'); clearCreate(); }
    else      { toast('❌ ' + (d.error || '失敗')); }
  } catch { toast('❌ 網路錯誤'); }
  btn.disabled = false; btn.textContent = '🚀 開始揪團！';
}

/* ══════════════════════════════════
   開團管理
══════════════════════════════════ */
async function loadProducts() {
  document.getElementById('manage-body').innerHTML =
    '<div class="state-box"><div class="state-icon">⏳</div><p>載入中…</p></div>';
  try {
    const d = await api({ action: 'list_products' });
    allProducts = d.ok ? (d.data?.products || d.products || []) : [];
    renderManageTable();
  } catch {
    document.getElementById('manage-body').innerHTML =
      '<div class="state-box"><p>載入失敗，請重試</p></div>';
  }
}

function pid(p)    { return p.id || p.productId || p.product_id || ''; }
function varStr(p) {
  const v = p.variants || p.variant || '';
  return Array.isArray(v) ? v.join(',') : v;
}
function pkgStr(p) {
  const v = p.packaging || '標準包裝';
  return Array.isArray(v) ? v.join(',') : v;
}

function renderManageTable() {
  if (!allProducts.length) {
    document.getElementById('manage-body').innerHTML =
      '<div class="state-box"><div class="state-icon">📭</div><p>尚無開團記錄</p></div>';
    return;
  }
  const now = new Date();
  const rows = allProducts.map(p => {
    const deadlineDate = p.deadline ? new Date(p.deadline) : null;
    const active = deadlineDate && deadlineDate >= now;
    const badge  = active
      ? '<span class="badge badge-active">進行中</span>'
      : '<span class="badge badge-closed">已截止</span>';
    const id       = pid(p);
    const safeName = (p.name || '').replace(/'/g, "\\'");
    return `<tr>
      <td>${p.name || '-'}</td>
      <td style="font-size:.78rem;color:${active ? 'var(--warning)' : 'var(--muted)'};font-variant-numeric:tabular-nums">
        ${fmtDeadline(p.deadline)}
      </td>
      <td>${badge}</td>
      <td class="td-actions">
        <button class="btn btn-info btn-sm"   onclick='openCopy("${id}")'>複製</button>
        <button class="btn btn-ghost btn-sm"  onclick='openEdit("${id}")'>編輯</button>
        <button class="btn btn-danger btn-sm" onclick='delProduct("${id}","${safeName}")'>刪除</button>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('manage-body').innerHTML = `
    <div class="table-outer"><table>
      <thead><tr>
        <th>商品名稱</th><th>截止時間</th><th>狀態</th><th>操作</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

function openCopy(productId) {
  const p = allProducts.find(x => pid(x) === productId);
  if (!p) return;
  fillModal(p, true);
  document.getElementById('editModalTitle').textContent = '複製開新團';
  document.getElementById('editSaveBtn').textContent    = '開新團';
  document.getElementById('editModal').hidden = false;
}
function openEdit(productId) {
  const p = allProducts.find(x => pid(x) === productId);
  if (!p) return;
  fillModal(p, false);
  document.getElementById('editModalTitle').textContent = '編輯商品';
  document.getElementById('editSaveBtn').textContent    = '儲存更新';
  document.getElementById('editModal').hidden = false;
}

function fillModal(p, isNew) {
  document.getElementById('e-productId').value = pid(p);
  document.getElementById('e-isNew').value     = isNew ? '1' : '0';
  document.getElementById('e-name').value      = p.name || '';
  document.getElementById('e-desc').value      = p.description || '';
  document.getElementById('e-variants').value  = varStr(p);
  document.getElementById('e-packaging').value = pkgStr(p);
  document.getElementById('e-image-file').value = '';
  document.getElementById('e-img-filename').textContent = '';

  const { date, time } = splitDeadline(p.deadline || '');
  document.getElementById('e-deadline').value     = date;
  document.getElementById('e-deadlineTime').value = time;

  // 現有圖片預覽（支援逗號分隔多圖）
  const existingUrl = p.image_url || '';
  document.getElementById('e-image-url').value = existingUrl;
  const wrap = document.getElementById('img-preview-wrap');
  if (existingUrl) {
    buildExistingImgGrid(existingUrl, 'e-img-grid');
    document.getElementById('desc-preview').textContent = p.description || '';
    wrap.style.display = 'block';
  } else {
    document.getElementById('e-img-grid').innerHTML = '';
    wrap.style.display = 'none';
  }
}

function closeModal() { document.getElementById('editModal').hidden = true; }

async function saveEdit() {
  const name     = document.getElementById('e-name').value.trim();
  const deadline = document.getElementById('e-deadline').value;
  if (!name || !deadline) { toast('請填寫必填欄位'); return; }

  const isNew     = document.getElementById('e-isNew').value === '1';
  const productId = document.getElementById('e-productId').value;

  const deadlineTime = document.getElementById('e-deadlineTime').value || '23:59';
  const deadlineISO  = buildDeadlineISO(deadline, deadlineTime);

  const payload = {
    action:      isNew ? 'create_product' : 'update_product',
    name,
    description: document.getElementById('e-desc').value.trim(),
    imageUrl:    document.getElementById('e-image-url').value.trim(),
    price:       0,
    unit:        '份',
    minQty:      1,
    maxQty:      99,
    deadline:    deadlineISO,
    variants:    document.getElementById('e-variants').value,
    packaging:   document.getElementById('e-packaging').value || '標準包裝'
  };
  if (!isNew) payload.productId = productId;

  const btn = document.getElementById('editSaveBtn');
  btn.disabled = true; btn.textContent = '處理中…';

  // ✅ 多圖上傳
  const eFileInput = document.getElementById('e-image-file');
  const eFiles = Array.from(eFileInput.files || []);
  if (eFiles.length > 0) {
    const urls = [];
    for (let i = 0; i < eFiles.length; i++) {
      btn.textContent = `上傳第 ${i + 1}/${eFiles.length} 張圖片…`;
      const uploadedUrl = await uploadImageToGAS(eFiles[i]);
      if (uploadedUrl === null) {
        btn.disabled = false;
        btn.textContent = isNew ? '開新團' : '儲存更新';
        return;
      }
      urls.push(uploadedUrl);
    }
    payload.imageUrl = urls.join(',');
    document.getElementById('e-image-url').value = payload.imageUrl;
    btn.textContent = '處理中…';
  }

  try {
    const d = await api(payload);
    if (d.ok) { toast(isNew ? '✅ 新團已建立！' : '✅ 更新成功！'); closeModal(); loadProducts(); }
    else      { toast('❌ ' + (d.error || '失敗')); }
  } catch { toast('❌ 網路錯誤'); }
  btn.disabled = false;
  btn.textContent = isNew ? '開新團' : '儲存更新';
}

async function delProduct(productId, name) {
  if (!confirm(`確定要刪除「${name}」？此操作無法復原。`)) return;
  try {
    const d = await api({ action: 'delete_product', productId });
    if (d.ok) { toast('✅ 已刪除'); loadProducts(); }
    else      { toast('❌ ' + (d.error || '刪除失敗')); }
  } catch { toast('❌ 網路錯誤'); }
}

/* ══════════════════════════════════
   訂單管理
══════════════════════════════════ */
async function loadOrdersTab() {
  document.getElementById('ord-lv2').hidden = true;
  document.getElementById('ord-lv1').hidden = false;
  document.getElementById('ord-products').innerHTML =
    '<div class="state-box"><div class="state-icon">⏳</div><p>載入中…</p></div>';
  try {
    const [pD, oD] = await Promise.all([
      api({ action: 'list_products' }),
      api({ action: 'list_orders'   })
    ]);
    allProducts = pD.ok ? (pD.data?.products || pD.products || []) : [];
    allOrders   = oD.ok ? (oD.data?.orders   || oD.orders   || []) : [];
    renderOrdProducts();
  } catch {
    document.getElementById('ord-products').innerHTML =
      '<div class="state-box"><p>載入失敗，請重試</p></div>';
  }
}

function oid(o)  { return o.orderId || o.order_id || ''; }
function opid(o) { return o.productId || o.product_id || ''; }

function renderOrdProducts() {
  if (!allProducts.length) {
    document.getElementById('ord-products').innerHTML =
      '<div class="state-box"><div class="state-icon">📭</div><p>尚無開團記錄</p></div>';
    return;
  }
  const rows = allProducts.map(p => {
    const id    = pid(p);
    const count = allOrders.filter(o => opid(o) === id).length;
    return `<tr class="clickable" onclick="showOrdDetail('${id}')">
      <td>${p.name || '-'}</td>
      <td style="font-size:.78rem;font-variant-numeric:tabular-nums">${fmtDeadline(p.deadline)}</td>
      <td><b>${count}</b> 筆</td>
      <td style="color:var(--muted)">→</td>
    </tr>`;
  }).join('');
  document.getElementById('ord-products').innerHTML = `
    <div class="table-outer"><table>
      <thead><tr>
        <th>商品名稱</th><th>截止時間</th><th>訂單</th><th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

function showOrdDetail(productId) {
  const p      = allProducts.find(x => pid(x) === productId) || {};
  const orders = allOrders.filter(o => opid(o) === productId);
  document.getElementById('ord-product-name').textContent = p.name || '訂單列表';
  document.getElementById('ord-lv1').hidden = true;
  document.getElementById('ord-lv2').hidden = false;

  if (!orders.length) {
    document.getElementById('ord-list').innerHTML =
      '<div class="state-box"><div class="state-icon">📭</div><p>這個商品尚無訂單</p></div>';
    return;
  }

  const STATUS = {
    pending: '待確認', reviewing: '審核中',
    confirmed: '已確認', shipped: '已出貨', cancelled: '已取消'
  };
  const rows = orders.map(o => {
    const st       = o.status || 'pending';
    const lid      = o.lineUserId || o.line_user_id || '';
    const canNotify = (st === 'confirmed') && lid;
    const notifyBtn = canNotify
      ? `<button class="btn btn-warning btn-sm"
           onclick='doNotify("${oid(o)}","${lid}","${(p.name||'').replace(/'/g,"\\'")}","${(o.customerName||o.customer_name||'').replace(/'/g,"\\'")}")'>
           📣 速來領取</button>`
      : '';
    return `<tr>
      <td>${o.customerName || o.customer_name || '-'}</td>
      <td>${o.variant || '-'}</td>
      <td>${o.quantity || 1}</td>
      <td>${o.paymentMethod || o.payment_method || '-'}</td>
      <td><span class="badge badge-${st}">${STATUS[st] || st}</span></td>
      <td>${notifyBtn}</td>
    </tr>`;
  }).join('');

  document.getElementById('ord-list').innerHTML = `
    <div class="table-outer"><table>
      <thead><tr>
        <th>客戶名</th><th>規格</th><th>數量</th>
        <th>付款方式</th><th>狀態</th><th>操作</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

function ordBack() {
  document.getElementById('ord-lv2').hidden = true;
  document.getElementById('ord-lv1').hidden = false;
}

async function doNotify(orderId, lineUserId, productName, customerName) {
  if (!confirm(`確定要通知 ${customerName || '這位客戶'} 來領取「${productName}」嗎？`)) return;
  try {
    const d = await api({ action: 'notify_pickup', orderId, lineUserId, productName });
    if (d.ok) toast('✅ 通知已發送！');
    else      toast('❌ ' + (d.error || '通知失敗'));
  } catch { toast('❌ 網路錯誤'); }
}

/* ══════════════════════════════════
   Toast
══════════════════════════════════ */
let _toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}
</script>
