<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Line 團購</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* ── 主題 token ───────────────────────────────────────────── */
:root {
  --green:       #06C755;
  --green-dark:  #05a548;
  --red:         #E84040;
  --amber:       #F5A623;
  --blue:        #1a73e8;

  --bg:          #f2f3f5;
  --surface:     #ffffff;
  --surface-2:   #f8f8f8;
  --border:      #e8e8e8;
  --text:        #1a1a1a;
  --text-2:      #666666;
  --text-3:      #999999;

  --radius:      12px;
  --radius-sm:   8px;
  --transition:  0.22s cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0d0d0d;
    --surface:   #1c1c1c;
    --surface-2: #252525;
    --border:    #333333;
    --text:      #f0f0f0;
    --text-2:    #aaaaaa;
    --text-3:    #666666;
  }
}
:root[data-theme="dark"] {
  --bg:        #0d0d0d;
  --surface:   #1c1c1c;
  --surface-2: #252525;
  --border:    #333333;
  --text:      #f0f0f0;
  --text-2:    #aaaaaa;
  --text-3:    #666666;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); }
img { max-width: 100%; display: block; }
button { cursor: pointer; border: none; font-family: inherit; }

/* ── App ─────────────────────────────────────────────────── */
#app {
  min-height: 100%;
  max-width: 420px;
  margin: 0 auto;
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
}

.screen { display: none; flex-direction: column; min-height: 100dvh; }
.screen.active { display: flex; animation: slideIn .25s ease; }
@keyframes slideIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; } }

/* ── 頂部導覽列 ───────────────────────────────────────────── */
.nav {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  z-index: 10;
}
.nav-back {
  width: 32px; height: 32px;
  background: var(--surface-2);
  border-radius: 50%;
  display: grid; place-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.nav-title { font-size: 15px; font-weight: 700; flex: 1; }

/* ── 卡片 ─────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  border: 1px solid var(--border);
}

/* ── 滾動內容區 ───────────────────────────────────────────── */
.scroll-body {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 100px;
}

/* ── 商品主視覺（已移除）─────────────────────────────────── */
.product-hero {
  display: none;
  width: 100%;
  aspect-ratio: 16/9;
  background: linear-gradient(135deg, #06C755 0%, #1a73e8 100%);
  display: grid;
  place-content: center;
  font-size: 52px;
  flex-shrink: 0;
}
.product-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ── 商品資訊區 ───────────────────────────────────────────── */
.product-info {
  background: var(--surface);
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
}
.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
  white-space: nowrap;
}
.badge-green { background: #e6f7ed; color: var(--green-dark); }
.badge-red   { background: #fce8e8; color: var(--red); }
.badge-amber { background: #fff3e0; color: #e57c00; }
.badge-blue  { background: #e8f0fe; color: var(--blue); }

.product-name { font-size: 19px; font-weight: 700; margin: 8px 0 6px; line-height: 1.35; }
.product-desc { font-size: 13px; color: var(--text-2); line-height: 1.65; margin-bottom: 10px; }
.price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.price-now { font-size: 24px; font-weight: 700; color: var(--red); font-variant-numeric: tabular-nums; }
.price-old { font-size: 13px; color: var(--text-3); text-decoration: line-through; }
.meta-row { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-2); flex-wrap: wrap; }
.meta-row span { display: flex; align-items: center; gap: 3px; }
.countdown-inline { color: var(--amber); font-weight: 700; font-variant-numeric: tabular-nums; }

/* ── Stats ────────────────────────────────────────────────── */
.stats-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.stat-cell {
  padding: 10px 8px;
  text-align: center;
  border-right: 1px solid var(--border);
}
.stat-cell:last-child { border-right: none; }
.stat-val { font-size: 20px; font-weight: 700; color: var(--green); font-variant-numeric: tabular-nums; }
.stat-lbl { font-size: 10px; color: var(--text-3); margin-top: 1px; }

/* ── section 標題 ─────────────────────────────────────────── */
.section-label { font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 8px; }

/* ── 規格列 ───────────────────────────────────────────────── */
.variant-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid var(--border);
}
.variant-row:last-child { border-bottom: none; }
.vrow-check { width: 20px; height: 20px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }
.vrow-name {
  flex: 1;
  font-size: 14px;
  cursor: pointer;
  user-select: none;
  line-height: 1.4;
}
.vrow-price-tag { font-size: 11px; color: var(--text-3); margin-top: 2px; display: block; }
.vrow-subtotal {
  font-size: 13px;
  color: var(--green-dark);
  font-weight: 600;
  min-width: 58px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.vrow-qty { display: flex; align-items: center; gap: 6px; }
.vqty-btn {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--surface-2);
  border: 1.5px solid var(--border);
  font-size: 16px;
  display: grid; place-content: center;
  line-height: 1;
  transition: all var(--transition);
}
.vqty-btn:hover:not(:disabled) { background: #e6f7ed; border-color: var(--green); color: var(--green-dark); }
.vqty-val { font-size: 15px; font-weight: 700; min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }

/* ── 訂單摘要 ─────────────────────────────────────────────── */
.order-summary {
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  border: 1px solid var(--border);
  font-size: 13px;
}
.summary-row { display: flex; justify-content: space-between; padding: 3px 0; }
.summary-indent { padding-left: 10px; color: var(--text-2); font-size: 12px; }
.summary-total { font-size: 16px; font-weight: 700; color: var(--red); }

/* ── 付款方式（精簡版） ───────────────────────────────────── */
.pay-chip-group { display: flex; gap: 8px; flex-wrap: wrap; }
.pay-chip {
  flex: 1;
  min-width: 90px;
  padding: 9px 8px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--border);
  background: var(--surface-2);
  text-align: center;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all var(--transition);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.pay-chip .pay-icon { font-size: 20px; }
.pay-chip .pay-name { font-size: 12px; }
.pay-chip.selected { border-color: var(--green); background: #e6f7ed; color: var(--green-dark); }

textarea.remark-input {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 13px;
  font-family: inherit;
  background: var(--surface);
  color: var(--text);
  resize: none;
  outline: none;
  transition: border-color var(--transition);
}
textarea.remark-input:focus { border-color: var(--green); }

/* ── 底部固定按鈕 ─────────────────────────────────────────── */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 420px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex;
  gap: 10px;
  z-index: 10;
}
.btn-primary {
  flex: 1;
  background: var(--green);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  padding: 13px 0;
  border-radius: var(--radius-sm);
  transition: background var(--transition);
}
.btn-primary:hover { background: var(--green-dark); }
.btn-primary:disabled { background: var(--text-3); cursor: not-allowed; }
.btn-secondary {
  background: var(--surface-2);
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  padding: 13px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  white-space: nowrap;
}

/* ── Loading ──────────────────────────────────────────────── */
#loading {
  position: fixed; inset: 0;
  background: var(--bg);
  display: grid; place-content: center;
  z-index: 100;
  gap: 12px;
  text-align: center;
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 0 auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Toast ────────────────────────────────────────────────── */
#toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: #1a1a1a;
  color: #fff;
  font-size: 13px;
  padding: 8px 16px;
  border-radius: 20px;
  opacity: 0;
  transition: all .3s;
  pointer-events: none;
  white-space: nowrap;
  z-index: 300;
  max-width: 90vw;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── 成功 Modal（彈出頁面）─────────────────────────────────── */
#success-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0,0,0,.55);
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn .2s ease;
}
#success-modal.open { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-sheet {
  background: var(--surface);
  width: 100%;
  max-width: 420px;
  border-radius: 20px 20px 0 0;
  padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 14px;
  animation: slideUp .28s cubic-bezier(.4,0,.2,1);
  max-height: 92dvh;
  overflow-y: auto;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal-drag { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 6px; }

/* ── 訂單追蹤 Timeline ────────────────────────────────────── */
.timeline { position: relative; padding-left: 28px; }
.timeline::before { content: ''; position: absolute; left: 9px; top: 8px; bottom: 8px; width: 2px; background: var(--border); }
.tl-item { position: relative; padding: 0 0 20px 12px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-dot {
  position: absolute;
  left: -19px; top: 3px;
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--surface);
  z-index: 1;
}
.tl-item.done .tl-dot { background: var(--green); border-color: var(--green); }
.tl-item.current .tl-dot {
  background: var(--surface); border-color: var(--green);
  box-shadow: 0 0 0 3px #06C75520;
}
.tl-item.current .tl-dot::after {
  content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--green);
}
.tl-title { font-size: 14px; font-weight: 600; }
.tl-item.done .tl-title, .tl-item.current .tl-title { color: var(--green); }
.tl-item:not(.done):not(.current) .tl-title { color: var(--text-3); }
.tl-desc { font-size: 12px; color: var(--text-2); margin-top: 4px; }

.status-badge-lg {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 20px;
}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--text-2)">載入中…</div>
</div>

<div id="app">

  <!-- ========== 主畫面（商品詳情 + 規格選擇 + 確認下單，合併成一頁）========== -->
  <div class="screen active" id="s1">

    <!-- Stats -->
    <div class="stats-strip" id="s1-stats" style="display:none">
      <div class="stat-cell">
        <div class="stat-val" id="stat-orders">0</div>
        <div class="stat-lbl">已參團人數</div>
      </div>
      <div class="stat-cell">
        <div class="stat-val" id="stat-qty">0</div>
        <div class="stat-lbl">已下單件數</div>
      </div>
      <div class="stat-cell">
        <div class="stat-val countdown-inline" id="stat-countdown">計算中</div>
        <div class="stat-lbl">剩餘時間</div>
      </div>
    </div>

    <!-- 滾動內容：規格 + 摘要 + 付款 + 備註 -->
    <div class="scroll-body" id="s1-body">

      <!-- 規格選擇 -->
      <div class="card" id="variant-card" style="display:none">
        <div class="section-label">
          規格（價格）
          <span style="font-weight:400;color:var(--text-3);font-size:11px;margin-left:4px">可複選，各自填數量</span>
        </div>
        <div id="variant-list"></div>
        <div style="margin-top:8px;font-size:11px;color:var(--text-3)">
          每人每規格最多 <span id="max-qty-label">99</span> 件，總數量至少 1 件
        </div>
      </div>

      <!-- 訂單明細 -->
      <div class="order-summary" id="order-summary-card" style="display:none">
        <div class="summary-row" style="font-weight:700;font-size:13px;padding-bottom:4px">
          <span>訂單明細</span>
        </div>
        <div id="s1-variant-breakdown">
          <div style="font-size:12px;color:var(--text-3);padding:4px 0">尚未選擇規格</div>
        </div>
        <div class="summary-row" style="border-top:1px solid var(--border);margin-top:6px;padding-top:8px">
          <span style="font-weight:700">合計</span>
          <span class="summary-total" id="s1-total">NT$0</span>
        </div>
      </div>

      <!-- 付款方式 -->
      <div class="card" id="pay-card" style="display:none">
        <div class="section-label">付款方式</div>
        <div class="pay-chip-group">
          <div class="pay-chip selected" id="pay-transfer" onclick="selectPayment('transfer')">
            <span class="pay-icon">🏦</span>
            <span class="pay-name">銀行轉帳</span>
          </div>
          <div class="pay-chip" id="pay-on_site" onclick="selectPayment('on_site')">
            <span class="pay-icon">💵</span>
            <span class="pay-name">現場繳款</span>
          </div>
          <div class="pay-chip" id="pay-line_pay" onclick="selectPayment('line_pay')">
            <span class="pay-icon">💚</span>
            <span class="pay-name">LINE Pay</span>
          </div>
        </div>
      </div>

      <!-- 備註 -->
      <div class="card" id="remark-card" style="display:none">
        <div class="section-label">備註（選填）</div>
        <textarea class="remark-input" id="remarks" rows="2" placeholder="特殊需求、禮盒文字…"></textarea>
      </div>

    </div><!-- /scroll-body -->

    <!-- 底部按鈕 -->
    <div class="bottom-bar">
      <button class="btn-primary" id="s1-btn" disabled>載入中…</button>
    </div>

  </div><!-- /s1 -->

  <!-- ========== 訂單追蹤（s5）========== -->
  <div class="screen" id="s5">
    <div class="nav">
      <button class="nav-back" onclick="closeTracking()">←</button>
      <div class="nav-title">訂單追蹤</div>
    </div>
    <div class="scroll-body" style="padding-top:16px">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div>
            <div style="font-size:12px;color:var(--text-2)">訂單編號</div>
            <div style="font-size:13px;font-weight:600" id="track-id">ORD-…</div>
          </div>
          <div class="status-badge-lg badge-amber" id="track-status-badge">⏳ 待付款</div>
        </div>
        <div style="font-size:13px;color:var(--text-2);line-height:1.7" id="track-summary"></div>
      </div>
      <div class="card">
        <div class="section-label" style="margin-bottom:14px">配送進度</div>
        <div class="timeline" id="timeline"></div>
      </div>
    </div>
    <div class="bottom-bar">
      <button class="btn-primary" onclick="goToGroup()">回團購群組頁</button>
    </div>
  </div>

</div><!-- /app -->

<!-- ========== 成功 Modal ========== -->
<div id="success-modal">
  <div class="modal-sheet">
    <div class="modal-drag"></div>

    <!-- 成功圖示 -->
    <div style="text-align:center;padding:4px 0 8px">
      <div style="font-size:56px;animation:pop .4s cubic-bezier(.36,.07,.19,.97)">✅</div>
      <div style="font-size:20px;font-weight:700;margin-top:8px">下單成功！</div>
      <div style="font-size:12px;color:var(--text-2);margin-top:4px">確認通知已傳送至您的 LINE</div>
    </div>

    <!-- 訂單明細 -->
    <div style="background:var(--surface-2);border-radius:var(--radius);padding:14px;border:1px solid var(--border)">
      <div style="font-weight:700;font-size:13px;color:var(--text-2);margin-bottom:10px;text-align:center">訂單明細</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--text-2)">訂單編號</span>
        <span style="font-size:12px;color:var(--text-2)" id="receipt-id">ORD-…</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--text-2)">商品</span>
        <span style="text-align:right;max-width:60%;word-break:break-all" id="receipt-product">-</span>
      </div>
      <div id="receipt-variant-rows"></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--text-2)">付款方式</span>
        <span id="receipt-pay">-</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0 0;font-weight:700;font-size:15px">
        <span>總金額</span>
        <span style="color:var(--red)" id="receipt-total">NT$-</span>
      </div>
    </div>

    <!-- 付款提示 -->
    <div id="receipt-pay-hint" style="font-size:12px;color:var(--text-2);background:var(--surface-2);border-radius:var(--radius-sm);padding:12px;border:1px solid var(--border);line-height:1.7"></div>

    <!-- 操作按鈕 -->
    <div style="display:flex;flex-direction:column;gap:10px">
      <button class="btn-primary" style="border-radius:var(--radius-sm)" onclick="goToGroup()">回團購群組頁</button>
      <button class="btn-secondary" style="text-align:center" onclick="goToTracking()">查看訂單追蹤</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<style>
@keyframes pop {
  0% { transform: scale(.6); opacity: 0; }
  60% { transform: scale(1.15); opacity: 1; }
  100% { transform: scale(1); }
}
</style>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ── 狀態 ─────────────────────────────────────────────────────────────────────
const state = {
  liffId:         '',
  apiBase:        '',
  lineUserId:     '',
  displayName:    '',
  product:        null,
  currentOrderId: '',
  payMethod:      'transfer',
};

// ── 日期格式化 ────────────────────────────────────────────────────────────────
function formatDate(isoStr) {
  if (!isoStr) return '-';
  try {
    return new Intl.DateTimeFormat('zh-TW', {
      timeZone: 'Asia/Taipei',
      month: 'numeric', day: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: false,
    }).format(new Date(isoStr));
  } catch { return String(isoStr); }
}

// ── ✅ 解析「名稱(價格)」格式 ────────────────────────────────────────────────
function parseVariant(str) {
  const s = typeof str === 'object' && str !== null ? (str.name || '') : String(str);
  const m = s.match(/^(.+?)\((\d+(?:\.\d+)?)\)$/);
  if (m) return { name: m[1].trim(), price: Number(m[2]) };
  return { name: s.trim(), price: null };
}

// ── 初始化 ────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const params   = new URLSearchParams(location.search);
    state.apiBase  = 'https://line-group-buy.isabelcyen.workers.dev/';
    state.liffId   = '2011684954-69W5ZbCT';
    const pid      = params.get('pid') || '';

    await liff.init({ liffId: state.liffId });

    if (liff.isLoggedIn()) {
      const profile     = await liff.getProfile();
      state.lineUserId  = profile.userId;
      state.displayName = profile.displayName;
    }

    await loadProduct(pid);
    document.getElementById('loading').style.display = 'none';
  } catch (err) {
    console.error('init error:', err);
    document.getElementById('loading').innerHTML =
      `<div style="color:red;padding:32px;text-align:center">初始化失敗：${err.message}</div>`;
  }
}

// ── API ───────────────────────────────────────────────────────────────────────
async function apiGet(action, extra = {}) {
  const p = new URLSearchParams({ action, uid: state.lineUserId, ...extra });
  return (await fetch(`${state.apiBase}?${p}`)).json();
}
async function apiPost(body) {
  return (await fetch(state.apiBase, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...body, lineUserId: state.lineUserId }),
  })).json();
}

// ── 商品載入 ──────────────────────────────────────────────────────────────────
async function loadProduct(pid) {
  const resp = await apiGet('product', pid ? { pid } : {});
  if (!resp.ok) { showToast('找不到商品資訊'); return; }
  state.product = resp.data;
  renderProduct(resp.data);
}

// ── ✅ 渲染商品（主畫面，合併詳情 + 規格 + 摘要）─────────────────────────────
function renderProduct(p) {
  const deadline    = new Date(p.deadline);
  const deadlineStr = formatDate(p.deadline);
  const isExpired   = new Date() > deadline;
  const discountPct = p.original_price > p.price
    ? Math.round((1 - p.price / p.original_price) * 100) : 0;

  // （商品圖片與資訊區已移除，LINE 群組貼文已有）

  // ── Stats ────────────────────────────────────────────────
  document.getElementById('stat-orders').textContent = p.totalOrders ?? 0;
  document.getElementById('stat-qty').textContent    = p.totalQty    ?? 0;
  document.getElementById('s1-stats').style.display  = 'grid';

  // ── 顯示規格等區塊 ───────────────────────────────────────
  if (!isExpired) {
    document.getElementById('variant-card').style.display      = '';
    document.getElementById('order-summary-card').style.display = '';
    document.getElementById('pay-card').style.display           = '';
    document.getElementById('remark-card').style.display        = '';
  }

  // ── 倒計時 ────────────────────────────────────────────────
  startCountdown(deadline);

  // ── 填充規格 ──────────────────────────────────────────────
  fillVariants(p);

  // ── 按鈕狀態 ──────────────────────────────────────────────
  const btn = document.getElementById('s1-btn');
  if (isExpired) {
    btn.disabled    = true;
    btn.textContent = '⛔ 已截止收單';
  } else {
    btn.disabled    = false;
    btn.textContent = '確認下單';
    btn.onclick     = submitOrder;
  }
}

function startCountdown(deadline) {
  function tick() {
    const el   = document.getElementById('stat-countdown');
    const diff = deadline - Date.now();
    if (!el) return;
    if (diff <= 0) {
      el.textContent = '已截止';
      const btn = document.getElementById('s1-btn');
      if (btn && !btn.disabled) {
        btn.disabled    = true;
        btn.textContent = '⛔ 已截止收單';
      }
      return;
    }
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    el.textContent = h >= 24
      ? `${Math.floor(h/24)}天${h%24}時`
      : `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  tick();
  setInterval(tick, 1000);
}

// ── ✅ 規格列渲染（含各規格價格）────────────────────────────────────────────
function fillVariants(p) {
  const maxQty  = Number(p.max_qty) || 99;
  document.getElementById('max-qty-label').textContent = maxQty;

  const listEl = document.getElementById('variant-list');
  listEl.innerHTML = (p.variants || []).map((v, i) => {
    const parsed    = parseVariant(v);
    const unitPrice = parsed.price !== null ? parsed.price : Number(p.price);
    return `
    <div class="variant-row">
      <input type="checkbox" class="vrow-check" id="vchk-${i}"
        data-idx="${i}" data-name="${parsed.name}" data-price="${unitPrice}"
        onchange="onVariantCheck(${i})">
      <label class="vrow-name" for="vchk-${i}">
        ${parsed.name}
        <span class="vrow-price-tag">NT$${unitPrice} / 件</span>
      </label>
      <div class="vrow-qty">
        <button class="vqty-btn" onclick="changeVariantQty(${i},-1)">−</button>
        <span class="vqty-val" id="vqty-${i}">0</span>
        <button class="vqty-btn" onclick="changeVariantQty(${i},1)">+</button>
      </div>
      <span class="vrow-subtotal" id="vsub-${i}">NT$0</span>
    </div>`;
  }).join('');

  updateOrderTotal();
}

function onVariantCheck(idx) {
  const chk   = document.getElementById(`vchk-${idx}`);
  const qtyEl = document.getElementById(`vqty-${idx}`);
  if (chk.checked && Number(qtyEl.textContent) === 0) qtyEl.textContent = '1';
  if (!chk.checked) qtyEl.textContent = '0';
  updateOrderTotal();
}

function changeVariantQty(idx, delta) {
  const max   = Number(state.product?.max_qty) || 99;
  const qtyEl = document.getElementById(`vqty-${idx}`);
  const chk   = document.getElementById(`vchk-${idx}`);
  let cur     = Math.max(0, Math.min(max, Number(qtyEl.textContent) + delta));
  qtyEl.textContent = cur;
  chk.checked       = cur > 0;
  updateOrderTotal();
}

// ── ✅ 收集已選規格（含各規格自己的 price）───────────────────────────────────
function getSelectedVariants() {
  const p = state.product;
  if (!p) return [];
  return (p.variants || []).reduce((acc, v, i) => {
    const chk = document.getElementById(`vchk-${i}`);
    const qty = Number(document.getElementById(`vqty-${i}`)?.textContent || 0);
    if (chk?.checked && qty > 0) {
      const parsed = parseVariant(v);
      const price  = parsed.price !== null ? parsed.price : Number(p.price);
      acc.push({ name: parsed.name, qty, price });
    }
    return acc;
  }, []);
}

// ── ✅ 即時更新金額（各規格自己的單價）───────────────────────────────────────
function updateOrderTotal() {
  const p = state.product;
  if (!p) return;
  let grandTotal = 0;
  const rows = [];

  (p.variants || []).forEach((v, i) => {
    const parsed    = parseVariant(v);
    const unitPrice = parsed.price !== null ? parsed.price : Number(p.price);
    const chk       = document.getElementById(`vchk-${i}`);
    const qty       = chk?.checked ? Number(document.getElementById(`vqty-${i}`)?.textContent || 0) : 0;
    const sub       = unitPrice * qty;
    const subEl     = document.getElementById(`vsub-${i}`);
    if (subEl) subEl.textContent = qty > 0 ? `NT$${sub}` : 'NT$0';
    if (qty > 0) {
      rows.push(`<div class="summary-row summary-indent"><span>${parsed.name} × ${qty}</span><span>NT$${sub}</span></div>`);
      grandTotal += sub;
    }
  });

  const breakdown = document.getElementById('s1-variant-breakdown');
  if (breakdown) {
    breakdown.innerHTML = rows.length
      ? rows.join('')
      : `<div style="font-size:12px;color:var(--text-3);padding:4px 0">尚未選擇規格</div>`;
  }
  document.getElementById('s1-total').textContent = `NT$${grandTotal}`;
}

// ── 付款方式 ──────────────────────────────────────────────────────────────────
function selectPayment(method) {
  state.payMethod = method;
  ['transfer','on_site','line_pay'].forEach(m => {
    document.getElementById(`pay-${m}`)?.classList.toggle('selected', m === method);
  });
}

// ── ✅ 確認下單 → 提交 → 成功 Modal ─────────────────────────────────────────
async function submitOrder() {
  const selected  = getSelectedVariants();
  const totalQty  = selected.reduce((s, v) => s + v.qty, 0);
  if (totalQty < 1) { showToast('請至少勾選一項規格並填入數量 ⚠️'); return; }

  const btn = document.getElementById('s1-btn');
  btn.disabled    = true;
  btn.textContent = '送出中…';

  try {
    const p            = state.product;
    const total        = selected.reduce((s, v) => s + v.qty * v.price, 0);
    const variantLabel = selected.map(v => `${v.name}×${v.qty}`).join(', ');

    const resp = await apiPost({
      action:     'create_order',
      productId:  p.product_id,
      memberName: state.displayName,
      variant:    variantLabel,
      qty:        totalQty,
      total:      total,
      payMethod:  state.payMethod,
      notes:      document.getElementById('remarks').value,
    });

    if (!resp.ok) {
      showToast(resp.error || '下單失敗，請稍後再試');
      return;
    }

    // ── 重複訂購警示 ──────────────────────────────────────
    if (resp.data?.warning === 'DUPLICATE_ORDER') {
      const ex = resp.data.existingOrder;
      if (!confirm(`⚠️ 您已訂購過！\n訂單：${ex.order_id}\n規格：${ex.variant}\n確定再次訂購？`)) {
        liff.closeWindow();
        return;
      }
      const resp2 = await apiPost({
        action: 'create_order', productId: p.product_id, memberName: state.displayName,
        variant: variantLabel, qty: totalQty, total, payMethod: state.payMethod,
        notes: document.getElementById('remarks').value, allowDuplicate: true,
      });
      if (!resp2.ok) { showToast(resp2.error || '下單失敗'); return; }
      state.currentOrderId = resp2.data.orderId;
      openSuccessModal(resp2.data.orderId, selected, total);
      return;
    }

    state.currentOrderId = resp.data.orderId;
    openSuccessModal(resp.data.orderId, selected, total);

  } catch (err) {
    console.error('submitOrder error:', err);
    showToast('網路錯誤，請稍後再試');
  } finally {
    btn.disabled    = false;
    btn.textContent = '確認下單';
  }
}

// ── ✅ 打開成功 Modal（彈出頁面）────────────────────────────────────────────
function openSuccessModal(orderId, selected, total) {
  const p = state.product;

  document.getElementById('receipt-id').textContent      = orderId;
  document.getElementById('receipt-product').textContent = p?.name || '-';
  document.getElementById('receipt-pay').textContent     =
    { line_pay: 'LINE Pay', transfer: '銀行轉帳', on_site: '現場繳款' }[state.payMethod];
  document.getElementById('receipt-total').textContent   = `NT$${total}`;

  // 各規格明細行
  document.getElementById('receipt-variant-rows').innerHTML =
    selected.map(v =>
      `<div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--text-2)">${v.name}</span>
        <span>× ${v.qty}　NT$${v.qty * v.price}</span>
      </div>`
    ).join('');

  // 付款提示
  const hints = {
    transfer: '請完成轉帳後，截圖傳給團主核帳。',
    line_pay: '請點擊 LINE 中的付款連結完成付款。',
    on_site:  '請於取貨當日準備現金，攜帶正確金額，我們會在出貨時通知您。',
  };
  document.getElementById('receipt-pay-hint').textContent = hints[state.payMethod] || '';

  // 顯示 modal
  document.getElementById('success-modal').classList.add('open');

  // 預載訂單追蹤
  loadTrackingData(orderId);
}

// ── 查看訂單追蹤 ──────────────────────────────────────────────────────────────
function goToTracking() {
  document.getElementById('success-modal').classList.remove('open');
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('s5').classList.add('active');
}

function closeTracking() {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('s1').classList.add('active');

async function loadTrackingData(orderId) {
  let order;
  try {
    const resp = await apiGet('order', { oid: orderId });
    if (!resp.ok) return;
    order = resp.data;
  } catch { return; }

  const statusMap = {
    pending:   { label: '⏳ 待付款', cls: 'badge-amber', step: 0 },
    reviewing: { label: '🔍 審核中', cls: 'badge-blue',  step: 1 },
    paid:      { label: '✅ 已付款', cls: 'badge-green', step: 2 },
    shipped:   { label: '🚚 配送中', cls: 'badge-amber', step: 3 },
    received:  { label: '🎉 已收貨', cls: 'badge-green', step: 4 },
    cancelled: { label: '❌ 已取消', cls: 'badge-red',   step: -1 },
  };
  const status = statusMap[order.pay_status] || statusMap.pending;

  document.getElementById('track-id').textContent = orderId;
  const badge = document.getElementById('track-status-badge');
  badge.textContent = status.label;
  badge.className   = `status-badge-lg ${status.cls}`;

  document.getElementById('track-summary').innerHTML =
    `規格：${order.variant}<br>金額：<strong>NT$${order.total}</strong>`;

  const steps = [
    { label: '訂單成立',   desc: '您的訂單已成功建立' },
    { label: '付款確認中', desc: '團主正在核實您的付款' },
    { label: '已付款',     desc: '付款確認完成！' },
    { label: '配送中',     desc: '商品正在配送' },
    { label: '已收貨',     desc: '訂單完成，謝謝！' },
  ];

  document.getElementById('timeline').innerHTML = steps.map((s, i) => {
    const cls = i < status.step ? 'done' : i === status.step ? 'current' : '';
    return `<div class="tl-item ${cls}">
      <div class="tl-dot"></div>
      <div class="tl-title">${s.label}</div>
      <div class="tl-desc">${cls ? s.desc : ''}</div>
    </div>`;
  }).join('');
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let _toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}
