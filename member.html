<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>團購小幫手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
/* ─── Design tokens ─── */
:root {
  --green:      #06C755;
  --green-dk:   #04A544;
  --green-bg:   #F0FBF3;
  --bg:         #F4F6F4;
  --card:       #FFFFFF;
  --text:       #1A1F1A;
  --sub:        #5A6B5A;
  --muted:      #8A9A8A;
  --border:     #E2EAE2;
  --red:        #E84040;
  --amber:      #F5A623;
  --blue:       #27ACB2;
  --pin:        #FF6B35;
  --radius:     12px;
  --safe-t:     env(safe-area-inset-top, 0px);
  --safe-b:     env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #111811;
    --card:      #1A241A;
    --text:      #E8F0E8;
    --sub:       #92A892;
    --muted:     #6A7E6A;
    --border:    #253025;
    --green-bg:  #0D2014;
  }
}
:root[data-theme="dark"] {
  --bg:        #111811;
  --card:      #1A241A;
  --text:      #E8F0E8;
  --sub:       #92A892;
  --muted:     #6A7E6A;
  --border:    #253025;
  --green-bg:  #0D2014;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ─── Loading overlay ─── */
#loading {
  position: fixed; inset: 0; z-index: 999;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
}
.spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading p { color: var(--muted); font-size: 14px; }

/* ─── Header ─── */
.app-header {
  background: var(--green);
  color: #fff;
  padding: calc(var(--safe-t) + 10px) 16px 10px;
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
}
.app-header .icon { font-size: 20px; }
.app-header h1 { font-size: 17px; font-weight: 700; letter-spacing: .04em; }
.app-header .user-name {
  margin-left: auto;
  font-size: 13px;
  opacity: .9;
  max-width: 100px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ─── Tabs ─── */
.tabs {
  display: flex;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
  position: sticky; top: 0; z-index: 10;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 1; min-width: 70px;
  padding: 10px 6px 8px;
  background: none; border: none;
  border-bottom: 3px solid transparent;
  font-family: inherit; font-size: 12px; font-weight: 500;
  color: var(--muted); cursor: pointer;
  transition: color .15s, border-color .15s;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  white-space: nowrap;
}
.tab-btn .tab-icon { font-size: 17px; }
.tab-btn.active { color: var(--green); border-bottom-color: var(--green); }

/* ─── Content area ─── */
.content {
  flex: 1; overflow-y: auto;
  padding: 12px 12px calc(var(--safe-b) + 12px);
  -webkit-overflow-scrolling: touch;
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ─── Cards ─── */
.card {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
  margin-bottom: 10px;
}

/* ─── Announcement card ─── */
.ann-card { padding: 14px 16px; }
.ann-card.pinned { border-left: 3px solid var(--pin); background: color-mix(in srgb, var(--pin) 6%, var(--card)); }
.ann-header { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
.ann-pin { font-size: 13px; color: var(--pin); flex-shrink: 0; margin-top: 1px; }
.ann-title { font-size: 15px; font-weight: 700; line-height: 1.3; flex: 1; }
.ann-body { font-size: 13px; color: var(--sub); line-height: 1.6; white-space: pre-wrap; }
.ann-img { width: 100%; border-radius: 8px; margin-top: 10px; display: block; }
.ann-time { font-size: 11px; color: var(--muted); margin-top: 8px; }

/* ─── Product / group card ─── */
.prod-card .prod-img-wrap {
  position: relative; width: 100%; aspect-ratio: 16/7; overflow: hidden;
  background: var(--border);
}
.prod-card .prod-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.prod-card .prod-img-wrap .deadline-badge {
  position: absolute; top: 8px; right: 8px;
  background: rgba(0,0,0,.6); color: #fff;
  font-size: 11px; padding: 3px 8px; border-radius: 20px;
  backdrop-filter: blur(4px);
}
.prod-card .prod-body { padding: 12px 14px 4px; }
.prod-card .prod-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.prod-card .prod-desc { font-size: 13px; color: var(--sub); margin-bottom: 8px; line-height: 1.5; }
.prod-card .prod-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.prod-card .prod-price { font-size: 20px; font-weight: 700; color: var(--green); }
.prod-card .prod-price span { font-size: 13px; color: var(--muted); font-weight: 400; }
.prod-card .prod-stats { font-size: 12px; color: var(--muted); }
.prod-card .prod-footer {
  padding: 10px 14px 12px;
  display: flex; gap: 8px; align-items: center;
}
.btn-join {
  flex: 1; padding: 10px 0;
  background: var(--green); color: #fff;
  border: none; border-radius: 8px;
  font-family: inherit; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: background .15s;
}
.btn-join:hover { background: var(--green-dk); }
.btn-comment-toggle {
  padding: 10px 14px;
  background: var(--green-bg); color: var(--green);
  border: 1px solid var(--green); border-radius: 8px;
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
  transition: background .15s;
}
.btn-comment-toggle:hover { background: color-mix(in srgb, var(--green) 15%, var(--card)); }

/* ─── Comment area ─── */
.comment-area { border-top: 1px solid var(--border); padding: 10px 14px; display: none; }
.comment-area.open { display: block; }
.comment-list { margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
.comment-item {
  display: flex; gap: 8px; align-items: flex-start;
}
.comment-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--border); object-fit: cover; flex-shrink: 0;
  font-size: 14px; display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.comment-bubble {
  flex: 1; background: var(--bg); border-radius: 8px;
  padding: 7px 10px; font-size: 13px;
}
.comment-name { font-weight: 700; color: var(--green); font-size: 12px; margin-bottom: 2px; }
.comment-text { color: var(--text); line-height: 1.5; }
.comment-time { font-size: 11px; color: var(--muted); margin-top: 3px; }
.comment-input-row {
  display: flex; gap: 8px;
}
.comment-input-row input {
  flex: 1; padding: 8px 12px;
  border: 1px solid var(--border); border-radius: 20px;
  background: var(--bg); color: var(--text);
  font-family: inherit; font-size: 13px;
  outline: none;
}
.comment-input-row input:focus { border-color: var(--green); }
.btn-send {
  padding: 8px 14px;
  background: var(--green); color: #fff;
  border: none; border-radius: 20px;
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer;
}
.no-comment { font-size: 13px; color: var(--muted); text-align: center; padding: 8px 0; }

/* ─── My orders ─── */
.order-card { padding: 14px 16px; }
.order-top { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
.order-img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: var(--border); flex-shrink: 0; }
.order-info { flex: 1; }
.order-name { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
.order-variant { font-size: 13px; color: var(--sub); margin-bottom: 4px; }
.order-meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.order-total { font-size: 16px; font-weight: 700; color: var(--green); }
.order-id-label { font-size: 11px; color: var(--muted); }

/* ─── Status badge ─── */
.status-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
}
.st-pending   { background: #FFF3E0; color: #E65100; }
.st-reviewing { background: #E3F2FD; color: #1565C0; }
.st-paid      { background: #E8F5E9; color: #2E7D32; }
.st-shipped   { background: #FFF8E1; color: #F57F17; }
.st-received  { background: #F3E5F5; color: #6A1B9A; }
.st-cancelled { background: var(--border); color: var(--muted); }

/* ─── Status timeline ─── */
.timeline {
  display: flex; align-items: center; gap: 0;
  margin: 10px 0; overflow-x: auto; scrollbar-width: none;
  padding-bottom: 4px;
}
.timeline::-webkit-scrollbar { display: none; }
.tl-step {
  display: flex; flex-direction: column; align-items: center;
  min-width: 52px;
}
.tl-dot {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--card);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; flex-shrink: 0;
  transition: all .2s;
}
.tl-dot.done { background: var(--green); border-color: var(--green); color: #fff; }
.tl-dot.current { border-color: var(--green); color: var(--green); box-shadow: 0 0 0 3px var(--green-bg); }
.tl-label { font-size: 10px; color: var(--muted); margin-top: 3px; text-align: center; }
.tl-label.done, .tl-label.current { color: var(--green); font-weight: 600; }
.tl-line {
  flex: 1; height: 2px;
  background: var(--border); min-width: 20px;
  margin-bottom: 20px;
}
.tl-line.done { background: var(--green); }

/* ─── Order actions ─── */
.order-actions { display: flex; gap: 8px; margin-top: 10px; }
.btn-proof {
  flex: 1; padding: 9px;
  background: var(--blue); color: #fff;
  border: none; border-radius: 8px;
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer;
}
.btn-cancel {
  padding: 9px 14px;
  background: none; color: var(--muted);
  border: 1px solid var(--border); border-radius: 8px;
  font-family: inherit; font-size: 13px;
  cursor: pointer;
}
.btn-received {
  flex: 1; padding: 9px;
  background: var(--green); color: #fff;
  border: none; border-radius: 8px;
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer;
}

/* ─── Arrival card ─── */
.arrival-card { padding: 14px 16px; }
.arrival-top { display: flex; gap: 10px; align-items: center; }
.arrival-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background: var(--border); flex-shrink: 0; }
.arrival-info { flex: 1; }
.arrival-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.arrival-variant { font-size: 12px; color: var(--sub); }
.arrival-time { font-size: 11px; color: var(--muted); margin-top: 6px; }
.arrival-action { margin-top: 10px; }

/* ─── Empty state ─── */
.empty {
  text-align: center; padding: 40px 16px;
  color: var(--muted); font-size: 14px;
}
.empty .empty-icon { font-size: 36px; margin-bottom: 8px; }

/* ─── Proof upload modal ─── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.45);
  display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.modal-backdrop.open { opacity: 1; pointer-events: auto; }
.modal-sheet {
  width: 100%; background: var(--card);
  border-radius: 20px 20px 0 0;
  padding: 20px 16px calc(var(--safe-b) + 20px);
  transform: translateY(100%); transition: transform .28s cubic-bezier(.32,1,.28,1);
}
.modal-backdrop.open .modal-sheet { transform: translateY(0); }
.modal-sheet h3 { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 6px; font-weight: 500; }
.form-group input, .form-group textarea {
  width: 100%; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text);
  font-family: inherit; font-size: 14px;
}
.form-group input:focus, .form-group textarea:focus { border-color: var(--green); outline: none; }
.file-label {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border: 2px dashed var(--border);
  border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--sub);
  background: var(--bg); transition: border-color .15s;
}
.file-label:hover { border-color: var(--green); }
.file-label input { display: none; }
#preview-img { width: 100%; max-height: 160px; object-fit: cover; border-radius: 8px; margin-top: 8px; display: none; }
.modal-btns { display: flex; gap: 8px; margin-top: 16px; }
.btn-submit-proof {
  flex: 1; padding: 12px;
  background: var(--green); color: #fff;
  border: none; border-radius: 10px;
  font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
}
.btn-close-modal {
  padding: 12px 18px;
  background: var(--border); color: var(--sub);
  border: none; border-radius: 10px;
  font-family: inherit; font-size: 15px; cursor: pointer;
}

/* ─── Toast ─── */
.toast {
  position: fixed; bottom: calc(var(--safe-b) + 16px); left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1A1A1A; color: #fff;
  padding: 10px 20px; border-radius: 24px; font-size: 14px;
  opacity: 0; transition: opacity .25s, transform .25s;
  pointer-events: none; white-space: nowrap; z-index: 500;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── Section heading ─── */
.section-heading {
  font-size: 12px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .08em;
  padding: 4px 4px 8px;
}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <p>載入中…</p>
</div>

<!-- Header -->
<header class="app-header">
  <span class="icon">🛒</span>
  <h1>團購小幫手</h1>
  <span class="user-name" id="user-name"></span>
</header>

<!-- Tabs -->
<nav class="tabs" id="tabs">
  <button class="tab-btn active" data-tab="announcements">
    <span class="tab-icon">📢</span>公告
  </button>
  <button class="tab-btn" data-tab="groups">
    <span class="tab-icon">🛒</span>團購中
  </button>
  <button class="tab-btn" data-tab="myorders">
    <span class="tab-icon">📦</span>我的參團
  </button>
  <button class="tab-btn" data-tab="arrivals">
    <span class="tab-icon">🔔</span>到貨通知
  </button>
</nav>

<!-- Content -->
<main class="content">
  <!-- ── Tab 1: 公告 ── -->
  <section class="tab-panel active" id="tab-announcements">
    <div id="ann-list"><div class="empty"><div class="empty-icon">📢</div>載入中…</div></div>
  </section>

  <!-- ── Tab 2: 團購中 ── -->
  <section class="tab-panel" id="tab-groups">
    <div id="group-list"><div class="empty"><div class="empty-icon">🛒</div>載入中…</div></div>
  </section>

  <!-- ── Tab 3: 我的參團 ── -->
  <section class="tab-panel" id="tab-myorders">
    <div id="myorder-list"><div class="empty"><div class="empty-icon">📦</div>載入中…</div></div>
  </section>

  <!-- ── Tab 4: 到貨通知 ── -->
  <section class="tab-panel" id="tab-arrivals">
    <div id="arrival-list"><div class="empty"><div class="empty-icon">🔔</div>載入中…</div></div>
  </section>
</main>

<!-- 付款證明 modal -->
<div class="modal-backdrop" id="proof-modal">
  <div class="modal-sheet">
    <h3>📸 上傳付款證明</h3>
    <input type="hidden" id="proof-order-id">
    <div class="form-group">
      <label>轉帳末五碼</label>
      <input type="text" id="proof-ref" placeholder="例：12345" maxlength="10">
    </div>
    <div class="form-group">
      <label>轉帳截圖（選填）</label>
      <label class="file-label">
        <span id="file-label-text">📎 點此選擇圖片</span>
        <input type="file" id="proof-file" accept="image/*" onchange="previewImage(this)">
      </label>
      <img id="preview-img" alt="預覽">
    </div>
    <div class="modal-btns">
      <button class="btn-close-modal" onclick="closeModal()">取消</button>
      <button class="btn-submit-proof" onclick="submitProof()">確認送出</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── 設定 ─────────────────────────────────────────────────
const LIFF_ID  = '2011684954-5FxYJxh8';          // 公告板 LIFF（群組連結使用）
const API      = 'https://line-group-buy.isabelcyen.workers.dev';
const LIFF_ORDER = '2011684954-yOthIDvq';               // ← 換成你的 LIFF_ID（訂購頁）

// ─── State ────────────────────────────────────────────────
let me = { userId: '', name: '', avatar: '' };
let currentTab = 'announcements';
let loaded = {};   // { announcements: true, ... }

// ─── Util ─────────────────────────────────────────────────
function fmt(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtDeadline(iso) {
  if (!iso) return '無截止';
  const d = new Date(iso), now = new Date();
  const diff = d - now;
  if (diff < 0) return '已截止';
  if (diff < 3600000) return `${Math.ceil(diff/60000)} 分後截止`;
  if (diff < 86400000) return `${Math.ceil(diff/3600000)} 小時後截止`;
  return `截止 ${fmt(iso)}`;
}
function toast(msg, dur=2200) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}
async function api(body) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '請求失敗');
  return j.data;
}

// ─── LIFF init ────────────────────────────────────────────
async function initApp() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const profile = await liff.getProfile();
    me.userId = profile.userId;
    me.name   = profile.displayName;
    me.avatar = profile.pictureUrl || '';
    document.getElementById('user-name').textContent = me.name;
  } catch (e) {
    console.warn('LIFF init failed:', e);
    me.userId = 'dev-' + Math.random().toString(36).slice(2);
    me.name   = '訪客';
  }

  // 讀 URL tab 參數
  const params = new URLSearchParams(liff.getDecodedIDToken ? window.location.search : '');
  const initTab = params.get('tab') || 'announcements';

  document.getElementById('loading').style.display = 'none';

  // 設定 tab
  switchTab(initTab);
}

// ─── Tab switching ─────────────────────────────────────────
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  switchTab(btn.dataset.tab);
});

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + tab));
  if (!loaded[tab]) {
    loaded[tab] = true;
    loadTab(tab);
  }
}

async function loadTab(tab) {
  const loaders = {
    announcements: loadAnnouncements,
    groups:        loadGroups,
    myorders:      loadMyOrders,
    arrivals:      loadArrivals,
  };
  try {
    await loaders[tab]?.();
  } catch(e) {
    console.error(tab, e);
    const el = document.getElementById('tab-' + tab);
    if (el) el.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>載入失敗：${e.message}</div>`;
  }
}

// ─── Tab 1: 公告 ─────────────────────────────────────────
async function loadAnnouncements() {
  const el = document.getElementById('ann-list');
  el.innerHTML = '<div class="empty"><div class="empty-icon">⏳</div>載入中…</div>';
  const data = await api({ action: 'get_general_announcements' });
  const anns = (data.announcements || []).filter(a => a.title !== '__DELETED__');
  if (!anns.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📢</div>目前沒有公告</div>'; return;
  }
  el.innerHTML = anns.map(a => {
    const pinned = String(a.pinned).toLowerCase() === 'true';
    return `
      <div class="card ann-card${pinned ? ' pinned' : ''}">
        <div class="ann-header">
          ${pinned ? '<span class="ann-pin">📌</span>' : ''}
          <div class="ann-title">${esc(a.title)}</div>
        </div>
        ${a.content ? `<div class="ann-body">${esc(a.content)}</div>` : ''}
        ${a.image_url ? `<img class="ann-img" src="${esc(a.image_url)}" alt="" loading="lazy">` : ''}
        <div class="ann-time">${fmt(a.created_at)}</div>
      </div>`;
  }).join('');
}

// ─── Tab 2: 團購中 ───────────────────────────────────────
async function loadGroups() {
  const el = document.getElementById('group-list');
  el.innerHTML = '<div class="empty"><div class="empty-icon">⏳</div>載入中…</div>';
  const data = await api({ action: 'get_active_groups_v2' });
  const prods = data.products || [];
  if (!prods.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🛒</div>目前沒有進行中的團購</div>'; return;
  }
  el.innerHTML = prods.map(p => renderGroupCard(p)).join('');
  // Load comments for all products in background
  prods.forEach(p => loadComments(p.product_id));
}

function renderGroupCard(p) {
  const dlLabel  = fmtDeadline(p.deadline);
  const isExpired = p.deadline && new Date(p.deadline) < new Date();
  const imgs = (p.image_url || '').split(',').map(s=>s.trim()).filter(Boolean);
  const imgHtml = imgs.length
    ? `<div class="prod-img-wrap">
        <img src="${esc(imgs[0])}" alt="${esc(p.name)}" loading="lazy">
        <div class="deadline-badge">${esc(dlLabel)}</div>
       </div>`
    : `<div class="prod-img-wrap" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:32px;">🛒<div class="deadline-badge">${esc(dlLabel)}</div></div>`;

  const variants = (Array.isArray(p.variants) ? p.variants : [])
    .map(v => typeof v === 'object' ? v.name : String(v).split('(')[0].trim())
    .filter(Boolean).slice(0,4).join('、');

  return `
    <div class="card prod-card" data-pid="${esc(p.product_id)}">
      ${imgHtml}
      <div class="prod-body">
        <div class="prod-name">${esc(p.name)}</div>
        ${p.description ? `<div class="prod-desc">${esc(p.description.slice(0,60))}${p.description.length>60?'…':''}</div>` : ''}
        ${variants ? `<div style="font-size:12px;color:var(--muted);margin-bottom:6px;">規格：${esc(variants)}</div>` : ''}
        <div class="prod-meta">
          <div class="prod-stats">${p.totalOrders}人已參團</div>
        </div>
      </div>
      <div class="prod-footer">
        ${!isExpired
          ? `<button class="btn-join" onclick="joinGroup('${esc(p.product_id)}','${esc(p.name)}')">🎉 立即參團</button>`
          : `<button class="btn-join" disabled style="background:var(--muted)">已截止</button>`}
      </div>
    </div>`;
}

function toggleComments(pid) {
  const area = document.getElementById('cmts-' + pid);
  area.classList.toggle('open');
  if (area.classList.contains('open')) loadComments(pid);
}

async function loadComments(pid) {
  const listEl = document.getElementById('cmt-list-' + pid);
  if (!listEl) return;
  try {
    const data = await api({ action: 'get_comments', productId: pid });
    const cmts = (data.comments || []).filter(c => c.content !== '__DELETED__');
    const cntEl = document.getElementById('cnt-' + pid);
    if (cntEl) cntEl.textContent = cmts.length;
    if (!cmts.length) {
      listEl.innerHTML = '<div class="no-comment">還沒有留言，快來第一個互動吧！</div>'; return;
    }
    listEl.innerHTML = cmts.slice(-20).map(c => `
      <div class="comment-item">
        <div class="comment-avatar">
          ${c.avatar_url ? `<img src="${esc(c.avatar_url)}" style="width:100%;height:100%;object-fit:cover">` : '👤'}
        </div>
        <div class="comment-bubble">
          <div class="comment-name">${esc(c.member_name)}</div>
          <div class="comment-text">${esc(c.content)}</div>
          <div class="comment-time">${fmt(c.created_at)}</div>
        </div>
      </div>`).join('');
  } catch(e) {
    if (listEl) listEl.innerHTML = '<div class="no-comment">留言載入失敗</div>';
  }
}

async function postComment(pid) {
  const input = document.getElementById('cmt-input-' + pid);
  const content = (input?.value || '').trim();
  if (!content) return;
  if (!me.userId) { toast('請先登入 LINE'); return; }
  input.value = '';
  try {
    await api({ action: 'post_comment', productId: pid,
      lineUserId: me.userId, memberName: me.name,
      avatarUrl: me.avatar, content });
    await loadComments(pid);
  } catch(e) { toast('留言失敗：' + e.message); }
}

function joinGroup(pid, name) {
  const url = `https://liff.line.me/${LIFF_ORDER}?pid=${pid}`;
  if (liff.isInClient()) {
    liff.openWindow({ url, external: false });
  } else {
    window.open(url, '_blank');
  }
}

// ─── Tab 3: 我的參團 ─────────────────────────────────────
const STATUS_INFO = {
  pending:   { label: '待付款', cls: 'st-pending',   icon: '⏳', steps: [1,0,0,0,0] },
  reviewing: { label: '審核中', cls: 'st-reviewing', icon: '🔍', steps: [1,1,0,0,0] },
  paid:      { label: '已付款', cls: 'st-paid',      icon: '✅', steps: [1,1,1,0,0] },
  shipped:   { label: '出貨中', cls: 'st-shipped',   icon: '🚚', steps: [1,1,1,1,0] },
  received:  { label: '已收貨', cls: 'st-received',  icon: '🎉', steps: [1,1,1,1,1] },
  cancelled: { label: '已取消', cls: 'st-cancelled', icon: '❌', steps: [0,0,0,0,0] },
};
const TL_STEPS = ['待付款','已付款','確認中','出貨','收貨'];

async function loadMyOrders() {
  const el = document.getElementById('myorder-list');
  el.innerHTML = '<div class="empty"><div class="empty-icon">⏳</div>載入中…</div>';
  if (!me.userId) { el.innerHTML = '<div class="empty"><div class="empty-icon">🔐</div>請先登入</div>'; return; }
  const data = await api({ action: 'get_my_orders', lineUserId: me.userId });
  const orders = data.orders || [];
  if (!orders.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📦</div>您還沒有參團紀錄</div>'; return;
  }
  el.innerHTML = orders.map(o => renderOrderCard(o)).join('');
}

function renderOrderCard(o) {
  const s = STATUS_INFO[o.pay_status] || STATUS_INFO.cancelled;
  const stepsDone = s.steps;
  const tlHtml = TL_STEPS.map((label, i) => {
    const done = stepsDone[i] === 1;
    const isCur = done && (i === TL_STEPS.length-1 || !stepsDone[i+1]);
    return `
      ${i > 0 ? `<div class="tl-line${done ? ' done' : ''}"></div>` : ''}
      <div class="tl-step">
        <div class="tl-dot${isCur ? ' current' : done ? ' done' : ''}">
          ${done ? '✓' : (i+1)}
        </div>
        <div class="tl-label${isCur ? ' current' : done ? ' done' : ''}">${label}</div>
      </div>`;
  }).join('');

  const img = o.product_image
    ? `<img class="order-img" src="${esc(o.product_image)}" alt="" loading="lazy">`
    : `<div class="order-img" style="display:flex;align-items:center;justify-content:center;font-size:24px;">📦</div>`;

  let actions = '';
  if (o.pay_status === 'pending') {
    actions = `<div class="order-actions">
      <button class="btn-proof" onclick="openProofModal('${esc(o.order_id)}')">💳 上傳付款證明</button>
      <button class="btn-cancel" onclick="cancelOrder('${esc(o.order_id)}')">取消</button>
    </div>`;
  } else if (o.pay_status === 'shipped') {
    actions = `<div class="order-actions">
      <button class="btn-received" onclick="confirmReceived('${esc(o.order_id)}')">🎉 確認收貨</button>
    </div>`;
  }

  return `
    <div class="card order-card" data-oid="${esc(o.order_id)}">
      <div class="order-top">
        ${img}
        <div class="order-info">
          <div class="order-name">${esc(o.product_name)}</div>
          <div class="order-variant">${esc(o.variant)} × ${o.qty} 件</div>
          <div class="order-meta">
            <div class="order-total">NT$${o.total}</div>
            <span class="status-badge ${s.cls}">${s.icon} ${s.label}</span>
          </div>
        </div>
      </div>
      <div class="timeline">${tlHtml}</div>
      <div class="order-id-label">訂單 ${esc(o.order_id)}・${fmt(o.created_at)}</div>
      ${actions}
    </div>`;
}

async function cancelOrder(oid) {
  if (!confirm('確定要取消此訂單嗎？')) return;
  try {
    await api({ action: 'cancel_order', orderId: oid, lineUserId: me.userId });
    toast('✅ 訂單已取消');
    loaded.myorders = false;
    loadTab('myorders');
  } catch(e) { toast('取消失敗：' + e.message); }
}

async function confirmReceived(oid) {
  if (!confirm('確認已收到貨物嗎？')) return;
  try {
    // 用回覆文字觸發收貨（或直接 API）
    toast('✅ 感謝確認收貨！');
    loaded.myorders = false; loaded.arrivals = false;
    loadTab('myorders');
  } catch(e) { toast('操作失敗：' + e.message); }
}

// ─── Tab 4: 到貨通知 ─────────────────────────────────────
async function loadArrivals() {
  const el = document.getElementById('arrival-list');
  el.innerHTML = '<div class="empty"><div class="empty-icon">⏳</div>載入中…</div>';
  if (!me.userId) { el.innerHTML = '<div class="empty"><div class="empty-icon">🔐</div>請先登入</div>'; return; }
  const data = await api({ action: 'get_arrivals', lineUserId: me.userId });
  const orders = data.orders || [];
  if (!orders.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🔔</div>目前沒有到貨通知</div>'; return;
  }
  el.innerHTML = orders.map(o => {
    const shipped = o.pay_status === 'shipped';
    const img = o.product_image
      ? `<img class="arrival-img" src="${esc(o.product_image)}" alt="" loading="lazy">`
      : `<div class="arrival-img" style="display:flex;align-items:center;justify-content:center;font-size:22px;">📦</div>`;
    return `
      <div class="card arrival-card">
        <div class="arrival-top">
          ${img}
          <div class="arrival-info">
            <div class="arrival-name">${esc(o.product_name)}</div>
            <div class="arrival-variant">${esc(o.variant)} × ${o.qty} 件</div>
            <div style="margin-top:4px">
              <span class="status-badge ${shipped ? 'st-shipped' : 'st-received'}">
                ${shipped ? '🚚 等待取貨' : '🎉 已收貨'}
              </span>
            </div>
          </div>
        </div>
        ${shipped ? `<div class="arrival-action">
          <button class="btn-received" style="width:100%" onclick="confirmReceived('${esc(o.order_id)}')">
            ✅ 確認收貨
          </button>
        </div>` : ''}
        <div class="arrival-time">更新：${fmt(o.updated_at)}</div>
      </div>`;
  }).join('');
}

// ─── Proof modal ─────────────────────────────────────────
function openProofModal(oid) {
  document.getElementById('proof-order-id').value = oid;
  document.getElementById('proof-ref').value = '';
  document.getElementById('preview-img').style.display = 'none';
  document.getElementById('file-label-text').textContent = '📎 點此選擇圖片';
  document.getElementById('proof-modal').classList.add('open');
}
function closeModal() {
  document.getElementById('proof-modal').classList.remove('open');
}
function previewImage(input) {
  const file = input.files[0];
  if (!file) return;
  document.getElementById('file-label-text').textContent = '✅ ' + file.name;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById('preview-img');
    img.src = e.target.result;
    img.style.display = 'block';
  };
  reader.readAsDataURL(file);
}
async function submitProof() {
  const oid  = document.getElementById('proof-order-id').value;
  const ref  = document.getElementById('proof-ref').value.trim();
  const file = document.getElementById('proof-file').files[0];
  if (!ref && !file) { toast('請填入末五碼或上傳截圖'); return; }

  const btn = document.querySelector('.btn-submit-proof');
  btn.textContent = '上傳中…'; btn.disabled = true;

  try {
    let screenshotBase64 = '';
    let fileName = '';
    if (file) {
      screenshotBase64 = await new Promise(res => {
        const r = new FileReader();
        r.onload = e => res(e.target.result.split(',')[1]);
        r.readAsDataURL(file);
      });
      fileName = file.name;
    }
    await api({
      action: 'submit_proof',
      orderId: oid,
      transferRef: ref,
      screenshotBase64,
      fileName,
    });
    closeModal();
    toast('✅ 付款證明已送出，等待團主確認');
    loaded.myorders = false;
    loadTab('myorders');
  } catch(e) {
    toast('上傳失敗：' + e.message);
  } finally {
    btn.textContent = '確認送出'; btn.disabled = false;
  }
}

// ─── XSS escape ──────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ─── Start ────────────────────────────────────────────────
initApp().catch(e => {
  document.getElementById('loading').innerHTML =
    `<div style="text-align:center;padding:32px;color:var(--muted)">
      <div style="font-size:32px;margin-bottom:8px">⚠️</div>
      <div style="font-size:15px">初始化失敗<br><small>${e.message}</small></div>
    </div>`;
});
</script>
